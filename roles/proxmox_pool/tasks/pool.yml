---
- name: pool - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_pool_pools must be a non-empty list, and each item needs a 'poolid' key."
  when: proxmox_pool_pools | length == 0

# comment is only applied on creation — the module has no update path for it.
- name: pool - create/delete pools
  community.proxmox.proxmox_pool:
    api_host:         "{{ proxmox_api_host }}"
    api_user:         "{{ proxmox_api_user }}"
    api_password:     "{{ proxmox_api_password | default(omit) }}"
    api_token_id:     "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs:   "{{ proxmox_validate_certs }}"
    poolid:  "{{ item.poolid }}"
    comment: "{{ item.comment | default(omit) }}"
    state:   "{{ item.state | default('present') }}"
  loop: "{{ proxmox_pool_pools }}"
  loop_control:
    label: "{{ item.poolid }}"
  delegate_to: localhost
