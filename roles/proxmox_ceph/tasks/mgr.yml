---
- name: mgr - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_ceph_mgrs must be a non-empty list, and each item needs a 'node' key."
  when: proxmox_ceph_mgrs | length == 0

# Create/delete only — no way to designate active vs standby manager.
- name: mgr - create/delete Ceph managers
  community.proxmox.proxmox_ceph_mgr:
    api_host:         "{{ proxmox_api_host }}"
    api_user:         "{{ proxmox_api_user }}"
    api_password:     "{{ proxmox_api_password | default(omit) }}"
    api_token_id:     "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs:   "{{ proxmox_validate_certs }}"
    node:  "{{ item.node }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ proxmox_ceph_mgrs }}"
  loop_control:
    label: "{{ item.node }}"
  delegate_to: localhost
