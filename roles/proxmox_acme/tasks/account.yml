---
- name: account - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_acme_accounts must be a non-empty list, and each item needs a 'name' key."
  when: proxmox_acme_accounts | length == 0

- name: account - fail if not authenticated with a password
  ansible.builtin.fail:
    msg: >
      ACME account management requires root@pam password authentication
      (a PVE API restriction, not a limitation of this role) — set
      proxmox_acme_api_password. API tokens are not accepted for this
      operation, and this role always authenticates as root@pam for it.
  when: not proxmox_acme_api_password

# Once an account exists, only `contact` can be updated afterward — a PVE
# API limitation.
- name: account - create/update/delete ACME accounts
  community.proxmox.proxmox_acme_account:
    api_host:       "{{ proxmox_api_host }}"
    api_user:       root@pam
    api_password:   "{{ proxmox_acme_api_password }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    state:     "{{ item.state | default('present') }}"
    name:      "{{ item.name | default('default') }}"
    contact:   "{{ item.contact | default(omit) }}"
    directory: "{{ item.directory | default(omit) }}"
    tos:       "{{ item.tos | default(omit) }}"
    eab_kid:      "{{ item.eab_kid | default(omit) }}"
    eab_hmac_key: "{{ item.eab_hmac_key | default(omit) }}"
  loop: "{{ proxmox_acme_accounts }}"
  loop_control:
    label: "{{ item.name | default('default') }}"
  delegate_to: localhost
