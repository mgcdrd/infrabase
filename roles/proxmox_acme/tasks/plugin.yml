---
- name: plugin - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_acme_plugins must be a non-empty list, and each item needs a 'name' key."
  when: proxmox_acme_plugins | length == 0

- name: plugin - fail if not authenticated as root@pam with a password
  ansible.builtin.fail:
    msg: >
      ACME plugin management requires root@pam password authentication
      (a PVE API restriction, not a limitation of this role) — set
      proxmox_api_user: root@pam and proxmox_api_password.
      API tokens are not accepted for this operation.
  when: proxmox_api_user != 'root@pam' or not proxmox_api_password

- name: plugin - create/update/delete ACME DNS challenge plugins
  community.proxmox.proxmox_acme_plugin_dns:
    api_host:       "{{ proxmox_api_host }}"
    api_user:       "{{ proxmox_api_user }}"
    api_password:   "{{ proxmox_api_password }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    state:  "{{ item.state | default('present') }}"
    name:   "{{ item.name }}"
    plugin: "{{ item.plugin | default(omit) }}"
    data:   "{{ item.data | default(omit) }}"
    disable: "{{ item.disable | default(omit) }}"
    validation_delay: "{{ item.validation_delay | default(omit) }}"
  loop: "{{ proxmox_acme_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
