---

# pwquality.conf settings — applied on all OS families via libpwquality.
# credit values: negative = minimum count required, positive = bonus points cap.
password_policy_pwquality:
  - { key: lcredit,          value: "-1" }
  - { key: ucredit,          value: "-1" }
  - { key: dcredit,          value: "-1" }
  - { key: ocredit,          value: "-1" }
  - { key: difok,            value: "8"  }
  - { key: minclass,         value: "4"  }
  - { key: maxrepeat,        value: "3"  }
  - { key: maxclassrepeat,   value: "4"  }
  - { key: maxsequence,      value: "3"  }
  - { key: minlen,           value: "15" }
  - { key: dictcheck,        value: "1"  }
  - { key: enforce_for_root, value: ""   }

# Explicit aging variables — referenced in login_defs and aging tasks.
password_policy_pass_max_days: 60
password_policy_pass_min_days: 7

# /etc/login.defs settings.
password_policy_login_defs:
  - { key: PASS_MAX_DAYS, value: "{{ password_policy_pass_max_days }}" }
  - { key: PASS_MIN_DAYS, value: "{{ password_policy_pass_min_days }}" }
  - { key: PASS_MIN_LEN,  value: "15" }
  - { key: UMASK,         value: "027" }
  - { key: FAIL_DELAY,    value: "4"  }

# Days before an account is locked after its password expires.
password_policy_inactive_days: 30

# Shell session idle timeout in seconds. Written to /etc/profile.d/tmout.sh
# as 'declare -xr TMOUT=N' so it is both exported and read-only.
password_policy_tmout: 900

# Default umask for interactive shells.
password_policy_umask: "027"

# Maximum consecutive failed logins before lockout (RedHat only — faillock.conf).
password_policy_faillock_deny: 3

# Seconds before a locked account is automatically unlocked (RedHat only).
password_policy_faillock_unlock_time: 900

# Also lock root after failed attempts (RedHat only).
password_policy_faillock_even_deny_root: true

# Number of previous passwords to remember (RedHat only — pwhistory.conf).
password_policy_remember: 24

# Enforce pwhistory for root as well (RedHat only).
password_policy_pwhistory_enforce_root: true
