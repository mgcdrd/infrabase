---
- name: manage - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_storage_definitions must be a non-empty list, and each item needs 'name' and 'type' keys."
  when: proxmox_storage_definitions | length == 0

# No update path in the underlying module — state=present against an
# already-existing storage is always a no-op regardless of parameter drift.
# Delete and recreate if you need to change an existing storage's config.
- name: manage - create/delete storage definitions
  community.proxmox.proxmox_storage:
    api_host:         "{{ proxmox_api_host }}"
    api_user:         "{{ proxmox_api_user }}"
    api_password:     "{{ proxmox_api_password }}"
    api_token_id:     "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs:   "{{ proxmox_validate_certs }}"
    name:  "{{ item.name }}"
    type:  "{{ item.type }}"
    state: "{{ item.state | default('present') }}"
    nodes:   "{{ item.nodes | default(omit) }}"
    content: "{{ item.content | default(omit) }}"
    cephfs_options:  "{{ item.cephfs_options | default(omit) }}"
    cifs_options:    "{{ item.cifs_options | default(omit) }}"
    dir_options:     "{{ item.dir_options | default(omit) }}"
    iscsi_options:   "{{ item.iscsi_options | default(omit) }}"
    nfs_options:     "{{ item.nfs_options | default(omit) }}"
    pbs_options:     "{{ item.pbs_options | default(omit) }}"
    rbd_options:     "{{ item.rbd_options | default(omit) }}"
    zfspool_options: "{{ item.zfspool_options | default(omit) }}"
  loop: "{{ proxmox_storage_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
