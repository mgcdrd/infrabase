---

- name: rsyslog configure - Set log file creation mode (CIS 4.2.1.3)
  ansible.builtin.template:
    src:   10-file-mode.conf.j2
    dest:  /etc/rsyslog.d/10-file-mode.conf
    owner: root
    group: root
    mode:  "0640"
  notify: restart rsyslog

- name: rsyslog configure - Deploy remote forwarding config
  ansible.builtin.template:
    src:   50-remote.conf.j2
    dest:  /etc/rsyslog.d/50-remote.conf
    owner: root
    group: root
    mode:  "0640"
  notify: restart rsyslog
  when: rsyslog_remote_host | length > 0

- name: rsyslog configure - Remove remote forwarding config when host is unset
  ansible.builtin.file:
    path:  /etc/rsyslog.d/50-remote.conf
    state: absent
  notify: restart rsyslog
  when: rsyslog_remote_host | length == 0

- name: rsyslog configure - Deploy named rulesets (local routing and/or forwarding)
  ansible.builtin.template:
    src:   20-rulesets.conf.j2
    dest:  /etc/rsyslog.d/20-rulesets.conf
    owner: root
    group: root
    mode:  "0640"
  notify: restart rsyslog
  when: rsyslog_rulesets | length > 0

- name: rsyslog configure - Remove named rulesets when unset
  ansible.builtin.file:
    path:  /etc/rsyslog.d/20-rulesets.conf
    state: absent
  notify: restart rsyslog
  when: rsyslog_rulesets | length == 0

# rsyslog_receiver_enable (simple single port pair) and rsyslog_listeners
# (multi-port/multi-IP) are merged into one input set here so imudp/imtcp
# are each module(load=...)'d exactly once — rsyslog errors ("module ...
# already in this config, cannot be added") if the same module is loaded
# from two separate drop-in files.
- name: rsyslog configure - Build effective listener list
  ansible.builtin.set_fact:
    _rsyslog_effective_listeners: >-
      {{ rsyslog_listeners
         + ([{'port': rsyslog_receiver_tcp_port, 'protocol': 'tcp'}] if rsyslog_receiver_enable else [])
         + ([{'port': rsyslog_receiver_udp_port, 'protocol': 'udp'}] if rsyslog_receiver_enable else []) }}

- name: rsyslog configure - Deploy listeners (receiver port(s) and/or multi-port ruleset inputs)
  ansible.builtin.template:
    src:   30-listeners.conf.j2
    dest:  /etc/rsyslog.d/30-listeners.conf
    owner: root
    group: root
    mode:  "0640"
  notify: restart rsyslog
  when: _rsyslog_effective_listeners | length > 0

- name: rsyslog configure - Remove listeners when unset
  ansible.builtin.file:
    path:  /etc/rsyslog.d/30-listeners.conf
    state: absent
  notify: restart rsyslog
  when: _rsyslog_effective_listeners | length == 0

- name: rsyslog configure - Deploy log archive/rotation script
  ansible.builtin.template:
    src:   logrotation.sh.j2
    dest:  "{{ rsyslog_log_archive_script_path }}"
    owner: root
    group: root
    mode:  "0750"
  when: rsyslog_log_archive_enable

# Removes the pre-Ansible unmanaged crontab line this feature replaces.
# ansible.builtin.cron requires `name` and only ever matches/manages its
# own "#Ansible: <name>" marker — it can't touch an unmarked legacy entry.
# Without this, the old line and the new Ansible-managed one below would
# both run, executing the script twice. Goes through the `crontab` command
# rather than hardcoding /var/spool/cron paths, which differ (RedHat:
# /var/spool/cron/root, Debian: /var/spool/cron/crontabs/root).
- name: rsyslog configure - Check for legacy unmanaged log rotation crontab entry
  ansible.builtin.command: crontab -l -u root
  register: _rsyslog_current_crontab
  changed_when: false
  failed_when: false
  when: rsyslog_log_archive_enable

- name: rsyslog configure - Remove legacy unmanaged log rotation crontab entry
  ansible.builtin.shell: |
    set -o pipefail
    crontab -l -u root | grep -v -F '{{ rsyslog_log_archive_script_path }} 2> /dev/null &1>2' | crontab -u root -
  args:
    executable: /bin/bash
  when:
    - rsyslog_log_archive_enable
    - _rsyslog_current_crontab.stdout is defined
    - (rsyslog_log_archive_script_path ~ ' 2> /dev/null &1>2') in _rsyslog_current_crontab.stdout

- name: rsyslog configure - Schedule log archive/rotation cron job
  ansible.builtin.cron:
    name:   "rsyslog log archive/rotation ({{ rsyslog_log_archive_source_dir }})"
    user:   root
    minute: "{{ rsyslog_log_archive_cron_minute }}"
    hour:   "{{ rsyslog_log_archive_cron_hour }}"
    job:    "{{ rsyslog_log_archive_script_path }} >/dev/null 2>&1"
    state:  present
  when: rsyslog_log_archive_enable

- name: rsyslog configure - Remove log archive/rotation cron job when disabled
  ansible.builtin.cron:
    name:  "rsyslog log archive/rotation ({{ rsyslog_log_archive_source_dir }})"
    user:  root
    state: absent
  when: not rsyslog_log_archive_enable

- name: rsyslog configure - Remove log archive/rotation script when disabled
  ansible.builtin.file:
    path:  "{{ rsyslog_log_archive_script_path }}"
    state: absent
  when: not rsyslog_log_archive_enable
