---

- name: pam su - Create su access group
  ansible.builtin.group:
    name:   "{{ pam_su_group }}"
    state:  present
    system: true

- name: pam su - Configure pam_wheel for su
  ansible.builtin.lineinfile:
    path:        /etc/pam.d/su
    regexp:      '^#?\s*auth\s+required\s+pam_wheel\.so.*'
    line:        "auth    required    pam_wheel.so use_uid group={{ pam_su_group }}"
    insertafter: '^auth\s+required\s+pam_rootok\.so'
