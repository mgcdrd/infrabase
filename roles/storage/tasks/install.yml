---

- name: storage install - Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache:     true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: storage install - Install storage packages
  ansible.builtin.package:
    name:
      - lvm2
      - parted
      - xfsprogs
      - dosfstools
    state: present
