---

- name: journald main - Check for systemd-journal-remote.socket
  # Not installed by this role — ForwardToSyslog below needs no extra
  # package, it's native to journald. If something else pulls in
  # systemd-journal-remote, mask its socket rather than leave it merely
  # disabled (CIS socket_systemd-journal-remote_disabled).
  ansible.builtin.systemd_service:
    name: systemd-journal-remote.socket
  register: _journald_remote_socket
  failed_when: false
  changed_when: false

# status.LoadState is "not-found" when the unit genuinely doesn't exist —
# "status is defined" is nearly always true regardless, so it isn't a
# meaningful gate. failed_when: false mirrors the check above: masking is
# opportunistic CIS hardening, not something that should fail the whole
# play on a transient systemd/dbus hiccup right after other unit changes.
- name: journald main - Mask systemd-journal-remote.socket if present
  ansible.builtin.systemd_service:
    name:    systemd-journal-remote.socket
    state:   stopped
    enabled: false
    masked:  true
  when: _journald_remote_socket.status.LoadState | default('not-found') != 'not-found'
  register: _journald_remote_socket_mask
  retries: 2
  delay: 3
  until: _journald_remote_socket_mask is not failed
  failed_when: false

- name: journald main - Deploy journald configuration
  ansible.builtin.template:
    src:   journald.conf.j2
    dest:  /etc/systemd/journald.conf
    owner: root
    group: root
    mode:  "0644"
  notify: journald restart
