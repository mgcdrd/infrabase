---

- name: docker install-debian - Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state:        present
    update_cache: true

- name: docker install-debian - Create keyrings directory
  ansible.builtin.file:
    path:  /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode:  "0755"

- name: docker install-debian - Download Docker GPG key
  ansible.builtin.get_url:
    url:   "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest:  /etc/apt/keyrings/docker.asc
    mode:  "0644"
    force: false

- name: docker install-debian - Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    state:    present
    filename: docker

- name: docker install-debian - Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state:        present
    update_cache: true
  notify: docker restart
