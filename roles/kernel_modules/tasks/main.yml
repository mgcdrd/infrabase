---

- name: kernel_modules main - Load and persist kernel modules
  community.general.modprobe:
    name:       "{{ item }}"
    state:      present
    persistent: present
  loop: "{{ kernel_modules_list }}"
  when: kernel_modules_list | length > 0

- name: kernel_modules main - Deploy blacklist configuration
  ansible.builtin.template:
    src:   blacklist.conf.j2
    dest:  /etc/modprobe.d/ansible-blacklist.conf
    owner: root
    group: root
    mode:  "0644"
  when: kernel_modules_blacklist | length > 0
