galaxy_info:
  author: mgcdrd
  description: >-
    Deploys arbitrary files, templates, and directories to hosts with
    explicit owner/group/mode on every item. Generic — not tied to any
    specific deployment's file set.

  license: GPL-3.0-or-later

  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - '9'
        - '10'
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - mgcdrd
    - files
    - templates
