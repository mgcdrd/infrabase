---

- name: restart postfix
  ansible.builtin.systemd_service:
    name:    postfix.service
    state:   restarted
    enabled: true

- name: postmap sasl_passwd
  ansible.builtin.command:
    cmd: postmap /etc/postfix/sasl_passwd
  changed_when: true

- name: run newaliases
  ansible.builtin.command:
    cmd: newaliases
  changed_when: true
