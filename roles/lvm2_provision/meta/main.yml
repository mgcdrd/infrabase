galaxy_info:
  author: mgcdrd
  description: >-
    Provisions LVM storage at system setup time — creates VGs, LVs, filesystems,
    and mounts. Designed for use once at provisioning, before mgcdrd.infrabase.lvm2
    takes over ongoing volume management.

  license: GPL-3.0-or-later

  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - '9'
        - '10'
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - mgcdrd
    - lvm
    - storage
    - disk
    - provisioning

#dependencies: []
