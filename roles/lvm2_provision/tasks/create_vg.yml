---

- name: lvm2_provision create_vg - Refresh LVM device cache
  ansible.builtin.command: vgscan
  changed_when: false
  become: true

- name: lvm2_provision create_vg - Get existing volume groups
  ansible.builtin.command:
    cmd: vgs --noheadings -o vg_name
  register: _lvm_existing_vgs
  changed_when: false
  failed_when: false
  become: true

# Remove stale device mapper nodes that block vgcreate. These are left behind
# when a previous vgcreate run was interrupted before LVM metadata was written.
- name: lvm2_provision create_vg - Remove stale device mapper nodes
  ansible.builtin.command:
    cmd: dmsetup remove {{ item.vg }}
  loop: "{{ lvm_provision_vgs }}"
  when:
    - item.vg not in (_lvm_existing_vgs.stdout_lines | map('trim') | list)
  failed_when: false
  changed_when: false
  become: true

# community.general.lvg initializes PVs automatically if not already done.
- name: lvm2_provision create_vg - Create volume groups
  community.general.lvg:
    vg: "{{ item.vg }}"
    pvs: "{{ item.pvs }}"
    pesize: "{{ item.pesize | default('4') }}"
    state: present
  loop: "{{ lvm_provision_vgs }}"
  when: item.vg not in (_lvm_existing_vgs.stdout_lines | map('trim') | list)
  become: true

- name: lvm2_provision create_vg - Verify all volume groups exist
  ansible.builtin.command:
    cmd: vgs {{ item.vg }}
  loop: "{{ lvm_provision_vgs }}"
  changed_when: false
  become: true
