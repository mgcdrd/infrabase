---
# Resizes the disk on the PVE side only — this role talks to the PVE API,
# not the guest. Chain mgcdrd.infrabase.lvm2 afterward (lvm_pv_grow +
# lvm_volumes) to grow the PV/LV/filesystem inside the VM — see this role's
# README for the full example, including the guest-side rescan step lvm2
# itself doesn't do.

- name: resize - expand disk in ProxMox to new size
  community.proxmox.proxmox_disk:
    api_host:         "{{ proxmox_api_host }}"
    api_user:         "{{ proxmox_api_user }}"
    api_password:     "{{ proxmox_api_password | default(omit) }}"
    api_token_id:     "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs:   "{{ proxmox_validate_certs }}"
    vmid:         "{{ proxmox_disk_vmid }}"
    disk:         "{{ proxmox_disk_slot }}"
    size:         "{{ proxmox_disk_size }}"
    state:        resized
  delegate_to: localhost
