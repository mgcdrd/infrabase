---
# Resize an existing disk on the PVE side, then expand LVM online.
# Assumes the disk is already a PV in a VG managed by lvm2_provision.
# Set proxmox_disk_resize_vg and proxmox_disk_resize_lvs in the caller.

- name: resize - expand disk in ProxMox to new size
  community.proxmox.proxmox_disk:
    api_host:         "{{ proxmox_api_host }}"
    api_user:         "{{ proxmox_api_user }}"
    api_password:     "{{ proxmox_api_password }}"
    api_token_id:     "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs:   "{{ proxmox_validate_certs }}"
    vmid:         "{{ proxmox_disk_vmid }}"
    disk:         "{{ proxmox_disk_slot }}"
    size:         "{{ proxmox_disk_size }}"
    state:        resized
  delegate_to: localhost

- name: resize - trigger PCI bus rescan to see enlarged disk
  ansible.builtin.shell:
    cmd: echo 1 > /sys/bus/pci/rescan
  become: true
  changed_when: false
  failed_when: false

- name: resize - pause for kernel to reflect new disk size
  ansible.builtin.pause:
    seconds: 3

- name: resize - re-read partition table on disk
  ansible.builtin.command:
    cmd: "partprobe {{ proxmox_disk_resize_device }}"
  become: true
  changed_when: false
  when: proxmox_disk_resize_device is defined

- name: resize - expand PV to fill disk
  ansible.builtin.command:
    cmd: "pvresize {{ proxmox_disk_resize_device }}"
  become: true
  changed_when: true
  when: proxmox_disk_resize_device is defined

- name: resize - extend logical volumes
  ansible.builtin.command:
    cmd: "lvextend -L {{ item.size }} /dev/{{ proxmox_disk_resize_vg }}/{{ item.lv }}"
  become: true
  changed_when: true
  loop: "{{ proxmox_disk_resize_lvs | default([]) }}"

- name: resize - grow XFS filesystems online
  ansible.builtin.command:
    cmd: "xfs_growfs {{ item.mount }}"
  become: true
  changed_when: true
  loop: "{{ proxmox_disk_resize_lvs | default([]) }}"
  when: item.fstype | default('xfs') == 'xfs'
