---
# ---- ProxMox API connection ----
# Resolves from the shared proxmox_api_* vars (set those once for the whole
# play/inventory) — override the proxmox_disk_api_* vars below only if this
# role must use a different node or credential.
#
# Two auth methods are supported — set one pair, leave the other unset:
#   - API token (recommended): proxmox_api_token_id + proxmox_api_token_secret
#   - Password:                 proxmox_api_user (default root@pam) + proxmox_api_password
# Unset vars resolve to `omit` so only the method you configure is sent to the module.
proxmox_disk_api_host:          "{{ proxmox_api_host | default('') }}"
proxmox_disk_api_user:          "{{ proxmox_api_user | default('root@pam') }}"
proxmox_disk_api_password:      "{{ proxmox_api_password | default(vault_proxmox_api_password | default(omit)) }}"
proxmox_disk_api_token_id:      "{{ proxmox_api_token_id | default(vault_proxmox_api_token_id | default(omit)) }}"
proxmox_disk_api_token_secret:  "{{ proxmox_api_token_secret | default(vault_proxmox_api_token_secret | default(omit)) }}"
proxmox_disk_validate_certs:    "{{ proxmox_validate_certs | default(false) }}"

# ---- VM targeting ----
# The role looks up the VM by name to discover its VMID and node automatically.
# Override proxmox_disk_vm_name if the VM's name in PVE differs from inventory_hostname.
proxmox_disk_vm_name: "{{ inventory_hostname }}"

# ---- Disk configuration ----
proxmox_disk_slot: virtio1        # PVE disk slot — must not already be occupied
proxmox_disk_storage: ""          # PVE storage backend (e.g. truenas, local-lvm)
proxmox_disk_size: "400"

# ---- Operation ----
# present: add a new disk in proxmox_disk_slot (fails if slot occupied)
# resized: expand an existing disk in proxmox_disk_slot to proxmox_disk_size
proxmox_disk_state: present

# ---- Result ----
# After the role runs, proxmox_disk_device is set as a host fact.
# Example: /dev/vdb
# Downstream roles (lvm2_provision) reference it as:
#   pvs: ["{{ proxmox_disk_device }}"]

# ---- Boot device exclusion ----
# Used when the disk was already attached (idempotent re-run) to find the
# pre-existing data disk by excluding known boot devices from the before list.
proxmox_disk_boot_devices:
  - sda
