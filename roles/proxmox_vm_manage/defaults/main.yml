---
# ---- ProxMox API connection (shared across all three underlying roles) ----
# Resolves from the shared proxmox_api_* vars (set those once for the whole
# play/inventory) — override the proxmox_vm_manage_api_* vars below only if
# this run needs a different node or credential than the rest of the play.
# vm_manage passes its own vars down to proxmox_disk/proxmox_nic/proxmox_snapshot
# explicitly (see tasks/main.yml) so this one interface always wins for all three.
#
# Two auth methods are supported — set one pair, leave the other unset:
#   - API token (recommended): proxmox_api_token_id + proxmox_api_token_secret
#   - Password:                 proxmox_api_user (default root@pam) + proxmox_api_password
proxmox_vm_manage_api_host:          "{{ proxmox_api_host | default('') }}"
proxmox_vm_manage_api_user:          "{{ proxmox_api_user | default('root@pam') }}"
proxmox_vm_manage_api_password:      "{{ proxmox_api_password | default(vault_proxmox_api_password | default(omit)) }}"
proxmox_vm_manage_api_token_id:      "{{ proxmox_api_token_id | default(vault_proxmox_api_token_id | default(omit)) }}"
proxmox_vm_manage_api_token_secret:  "{{ proxmox_api_token_secret | default(vault_proxmox_api_token_secret | default(omit)) }}"
proxmox_vm_manage_validate_certs:    "{{ proxmox_validate_certs | default(false) }}"

# ---- VM targeting ----
# Defaults to inventory_hostname — override if the VM name in PVE differs.
proxmox_vm_manage_vm_name: "{{ inventory_hostname }}"

# Set directly to skip the by-name lookup for the NIC/snapshot sub-roles
# (e.g. right after a proxmox_vm clone, when the VMID is already known).
# The disk sub-role always looks up by name — it has no VMID passthrough.
proxmox_vm_manage_vmid: ""

# ==============================================================
# Disks — one entry per disk to add or resize. Each entry runs a full
# proxmox_disk invocation (including its own by-name VM discovery), so N
# entries means N discovery calls — a limitation of the wrapped role, not
# this one.
# ==============================================================
# proxmox_vm_manage_disks:
#   - slot: virtio1               # PVE disk slot — must not already be occupied for state=present
#     storage: truenas             # PVE storage backend
#     size: "400"                  # GiB integer for state=present, "+XG" form for state=resized
#     state: present                # present | resized
#     resize_device: /dev/vdb       # resized only — block device to pvresize
#     resize_vg: vg_data            # resized only — VG containing the LVs to extend
#     resize_lvs:                   # resized only — LVs to extend and grow filesystem on
#       - lv: lv_data
#         size: 500G
#         mount: /data
#         fstype: xfs
proxmox_vm_manage_disks: []

# ==============================================================
# NICs — passed straight through to proxmox_nic_interfaces. See that role's
# README for the full per-entry key list (bridge, model, tag, firewall, mtu, mac).
# ==============================================================
# proxmox_vm_manage_nics:
#   - interface: net1
#     bridge: vmbr1
#     tag: 100
#     state: present                # present | absent
proxmox_vm_manage_nics: []

# ==============================================================
# Snapshots — passed straight through to proxmox_snapshot_snapshots. See that
# role's README for the full per-entry key list (vmstate, retention, force, unbind).
# ==============================================================
# proxmox_vm_manage_snapshots:
#   - snapname: pre-updates
#     state: present                 # present | absent | rollback
#     description: "Before OS updates"
#     retention: 5
proxmox_vm_manage_snapshots: []
