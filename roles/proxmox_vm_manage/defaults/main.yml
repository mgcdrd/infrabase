---
# ---- ProxMox API connection ----
# Uses the shared proxmox_api_* vars — see collections/infrabase/README.md.

# ---- VM targeting ----
# Defaults from the shared proxmox_target_vm_name var (falls back to
# inventory_hostname) — override proxmox_vm_manage_vm_name directly if this
# run's VM name in PVE differs from the rest of the play.
proxmox_vm_manage_vm_name: "{{ proxmox_target_vm_name | default(inventory_hostname) }}"

# Set directly to skip the by-name lookup for the NIC/snapshot sub-roles
# (e.g. right after a proxmox_vm clone, when the VMID is already known).
# The disk sub-role always looks up by name — it has no VMID passthrough.
proxmox_vm_manage_vmid: ""

# ==============================================================
# Disks — one entry per disk to add or resize. Each entry runs a full
# proxmox_disk invocation (including its own by-name VM discovery), so N
# entries means N discovery calls — a limitation of the wrapped role, not
# this one.
# ==============================================================
# proxmox_vm_manage_disks:
#   - slot: virtio1               # PVE disk slot — must not already be occupied for state=present
#     storage: truenas             # PVE storage backend
#     size: "400"                  # GiB integer for state=present, "+XG" form for state=resized
#     state: present                # present | resized
#     resize_device: /dev/vdb       # resized only — block device to pvresize
#     resize_vg: vg_data            # resized only — VG containing the LVs to extend
#     resize_lvs:                   # resized only — LVs to extend and grow filesystem on
#       - lv: lv_data
#         size: 500G
#         mount: /data
#         fstype: xfs
proxmox_vm_manage_disks: []

# ==============================================================
# NICs — passed straight through to proxmox_nic_interfaces. See that role's
# README for the full per-entry key list (bridge, model, tag, firewall, mtu, mac).
# ==============================================================
# proxmox_vm_manage_nics:
#   - interface: net1
#     bridge: vmbr1
#     tag: 100
#     state: present                # present | absent
proxmox_vm_manage_nics: []

# ==============================================================
# Snapshots — passed straight through to proxmox_snapshot_snapshots. See that
# role's README for the full per-entry key list (vmstate, retention, force, unbind).
# ==============================================================
# proxmox_vm_manage_snapshots:
#   - snapname: pre-updates
#     state: present                 # present | absent | rollback
#     description: "Before OS updates"
#     retention: 5
proxmox_vm_manage_snapshots: []
