---

# Cron schedule for the daily integrity check
aide_cron_hour:   "4"
aide_cron_minute: "5"

# Paths to include in the AIDE database, beyond the built-in set.
# Each entry requires 'path' and 'rule' keys.
# Example:
#   aide_extra_paths:
#     - { path: /opt/myapp, rule: CONTENT_EX }
aide_extra_paths: []

# Paths to explicitly exclude from monitoring (prepended with !).
# Example:
#   aide_exclude_paths:
#     - /var/log/myapp
aide_exclude_paths: []
