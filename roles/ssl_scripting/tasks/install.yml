---

- name: ssl_scripting install - Install openssl (Debian)
  ansible.builtin.apt:
    pkg:
      - openssl
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: ssl_scripting install - Install openssl (RedHat)
  ansible.builtin.dnf:
    name:  openssl
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
