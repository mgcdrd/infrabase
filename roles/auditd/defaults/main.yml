---

# ---- auditd.conf settings ----

auditd_local_events:           "yes"
auditd_log_format:             "ENRICHED"
auditd_name_format:            "hostname"
auditd_max_log_file_action:    "keep_logs"
auditd_space_left:             "25"
auditd_space_left_action:      "email"
auditd_action_mail_acct:       "root"
auditd_admin_space_left:       "12"
auditd_admin_space_left_action: "halt"
auditd_disk_full_action:       "single"
auditd_disk_error_action:      "syslog"
auditd_overflow_action:        "syslog"

# ---- audit rules — syscall groups ----
# Keys match what OpenSCAP/SSG CIS content expects.

# CIS 4.1.3.3 — time modification
auditd_time_syscalls:
  - { name: adjtimex,      key: "key=time-change" }
  - { name: clock_settime, key: "a0=0x0 -F key=time-change" }
  - { name: settimeofday,  key: "key=time-change" }

# CIS 4.1.3.4 — network configuration
auditd_network_syscalls:
  - sethostname
  - setdomainname

# CIS 4.1.3.5 — permission modification
# Syscalls present on all supported architectures.
auditd_perm_mod:
  - fchmod
  - fchmodat
  - fchown
  - fchownat
  - fremovexattr
  - fsetxattr
  - lremovexattr
  - lsetxattr
  - removexattr
  - setxattr

# x86_64-only: chmod/chown/lchown were removed from the aarch64 syscall table.
auditd_perm_mod_x86_only:
  - chmod
  - chown
  - lchown

auditd_perm_mod_root:
  - fremovexattr
  - fsetxattr
  - lremovexattr
  - lsetxattr
  - removexattr
  - setxattr

# CIS 4.1.3.6 — unsuccessful file access
# creat is x86_64-only; on aarch64 it was removed (use open with O_CREAT).
auditd_file_access_x86_only:
  - creat
  - open

auditd_file_access:
  - ftruncate
  - open_by_handle_at
  - openat
  - truncate

# CIS 4.1.3.9 — file deletion
# rename/rmdir/unlink were removed from the aarch64 syscall table.
auditd_file_delete_x86_only:
  - rename
  - rmdir
  - unlink

auditd_file_delete:
  - renameat
  - unlinkat

# CIS 4.1.3.15 — kernel module operations
# create_module and query_module are obsolete and absent from aarch64.
auditd_kernel_module_x86_only:
  - create_module
  - query_module

auditd_kernel_module_syscalls:
  - delete_module
  - finit_module
  - init_module

# CIS 4.1.3.12/14 — mount/export
auditd_mount_syscalls:
  - mount

# CIS 4.1.3.13 — privileged execution (setuid/setgid binaries, perm=x)
auditd_privileged_exec:
  - /usr/bin/chacl
  - /usr/bin/chcon
  - /usr/bin/setfacl
  - /usr/bin/kmod
  - /usr/sbin/usermod

# Privileged access (no perm filter — watched for any access)
auditd_privileged_access:
  - /usr/bin/chage
  - /usr/bin/chsh
  - /usr/bin/crontab
  - /usr/bin/gpasswd
  - /usr/bin/mount
  - /usr/bin/newgrp
  - /usr/bin/passwd
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/umount

# CIS 4.1.3.2, 4.1.3.4, 4.1.3.7, 4.1.3.10, 4.1.3.11, 4.1.3.16 — watchpoints
auditd_watches:
  # Sudoers changes (actions)
  - { file: /etc/sudoers,           perm: wa, key: actions }
  - { file: /etc/sudoers.d/,        perm: wa, key: actions }
  - { file: /var/log/sudo.log,      perm: wa, key: actions }

  # User/group identity (identity)
  - { file: /etc/group,             perm: wa, key: identity }
  - { file: /etc/gshadow,           perm: wa, key: identity }
  - { file: /etc/passwd,            perm: wa, key: identity }
  - { file: /etc/shadow,            perm: wa, key: identity }
  - { file: /etc/security/opasswd,  perm: wa, key: identity }
  - { file: /etc/nsswitch.conf,     perm: wa, key: identity }
  - { file: /etc/pam.conf,          perm: wa, key: identity }
  - { file: /etc/pam.d/,            perm: wa, key: identity }

  # Login/logout events (logins)
  - { file: /var/log/lastlog,       perm: wa, key: logins }
  - { file: /var/run/utmp,          perm: wa, key: logins }
  - { file: /var/log/btmp,          perm: wa, key: logins }
  - { file: /var/log/wtmp,          perm: wa, key: logins }

  # Network configuration (system-locale)
  - { file: /etc/hosts,             perm: wa, key: system-locale }
  - { file: /etc/hostname,          perm: wa, key: system-locale }
  - { file: /etc/issue,             perm: wa, key: system-locale }
  - { file: /etc/issue.net,         perm: wa, key: system-locale }

  # Time (time-change)
  - { file: /etc/localtime,         perm: wa, key: time-change }

  # Kernel module configuration (modules)
  - { file: /etc/modprobe.d/,       perm: wa, key: modules }
  - { file: /usr/bin/kmod,          perm: x,  key: modules }

# Red Hat-only watch paths (faillock, sysconfig, SELinux, NetworkManager)
auditd_watches_redhat:
  - { file: /var/run/faillock,               perm: wa, key: logins }
  - { file: /etc/sysconfig/network-scripts/, perm: wa, key: system-locale }
  - { file: /etc/NetworkManager/,            perm: wa, key: system-locale }
  - { file: /etc/selinux/,                   perm: wa, key: MAC-policy }
  - { file: /usr/share/selinux/,             perm: wa, key: MAC-policy }

# Debian-only watch paths (AppArmor)
auditd_watches_debian:
  - { file: /etc/apparmor/,    perm: wa, key: MAC-policy }
  - { file: /etc/apparmor.d/,  perm: wa, key: MAC-policy }
