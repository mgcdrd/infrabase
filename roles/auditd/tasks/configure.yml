---

- name: auditd configure - Remove default audit rules
  ansible.builtin.file:
    path:  /etc/audit/rules.d/audit.rules
    state: absent
  notify: auditd reload rules

- name: auditd configure - Determine mount points eligible for privileged command scan
  # Mirrors the CIS/SSG discovery method: mounts without noexec/nosuid are
  # where a setuid/setgid binary could actually be executed as such.
  ansible.builtin.set_fact:
    _auditd_privileged_mounts: "{{ ansible_facts.mounts
      | rejectattr('options', 'search', 'noexec|nosuid')
      | rejectattr('mount', 'match', '^/proc($|/.*$)')
      | map(attribute='mount') | list }}"

- name: auditd configure - Discover setuid/setgid binaries on eligible mounts
  ansible.builtin.shell: "find {{ item }} -xdev -perm /6000 -type f 2>/dev/null"
  loop: "{{ _auditd_privileged_mounts }}"
  register: _auditd_privileged_found
  changed_when: false

- name: auditd configure - Build combined privileged commands list
  ansible.builtin.set_fact:
    _auditd_privileged_commands: "{{ (_auditd_privileged_found.results
      | map(attribute='stdout_lines') | flatten
      + auditd_privileged_commands_extra) | unique | sort }}"

- name: auditd configure - Deploy base audit rules
  ansible.builtin.template:
    src:   auditd.rules.j2
    dest:  /etc/audit/rules.d/00-base.rules
    owner: root
    group: root
    mode:  "0640"
  notify: auditd reload rules

- name: auditd configure - Deploy loginuid immutability rule
  ansible.builtin.copy:
    src:   11-loginuid.rules
    dest:  /etc/audit/rules.d/11-loginuid.rules
    owner: root
    group: root
    mode:  "0640"
  notify: auditd reload rules

- name: auditd configure - Deploy auditd.conf
  ansible.builtin.template:
    src:   auditd.conf.j2
    dest:  /etc/audit/auditd.conf
    owner: root
    group: root
    mode:  "0640"
  notify: auditd restart

- name: auditd configure - Check current boot args (RedHat only)
  ansible.builtin.command:
    cmd: grubby --info=DEFAULT
  register: _grubby_info
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: auditd configure - Enable audit at boot (RedHat only)
  ansible.builtin.command:
    cmd: /sbin/grubby --update-kernel=ALL --args="audit=1 audit_backlog_limit=8192"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - "'audit=1' not in _grubby_info.stdout"
  changed_when: true
