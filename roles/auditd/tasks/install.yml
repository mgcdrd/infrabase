---

- name: auditd install - Install auditd
  ansible.builtin.package:
    name: "{{ 'auditd' if ansible_facts['os_family'] == 'Debian' else 'audit' }}"
    state: present

- name: auditd install - Enable and start auditd
  ansible.builtin.systemd_service:
    name:    auditd
    state:   started
    enabled: true
