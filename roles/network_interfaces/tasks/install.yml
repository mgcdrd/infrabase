---

- name: network_interfaces install - Install NetworkManager (Debian)
  ansible.builtin.apt:
    name:             network-manager
    state:            present
    update_cache:     true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: network_interfaces install - Install NetworkManager (RedHat)
  ansible.builtin.dnf:
    name:  NetworkManager
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: network_interfaces install - Let NetworkManager manage ifupdown-defined interfaces (Debian)
  # Debian's network-manager package ships with [ifupdown] managed=false,
  # so devices still referenced in /etc/network/interfaces are left alone.
  # This role drives everything through nmcli, so NM needs to own them too.
  community.general.ini_file:
    path:    /etc/NetworkManager/NetworkManager.conf
    section: ifupdown
    option:  managed
    value:   "true"
    mode:    "0644"
  when: ansible_facts['os_family'] == 'Debian'
  notify: restart NetworkManager

- name: network_interfaces install - Enable and start NetworkManager
  ansible.builtin.systemd_service:
    name:    NetworkManager
    state:   started
    enabled: true
