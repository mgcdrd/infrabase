---

# Order matters: physical interfaces and bond masters must exist as nmcli
# connection profiles before bond slaves reference their master, and before
# VLANs reference a bond's device as vlandev.

- name: network_interfaces configure - Configure physical interfaces
  community.general.nmcli:
    type:        ethernet
    conn_name:   "{{ item.name }}"
    ifname:      "{{ item.device | default(item.name) }}"
    state:       "{{ item.state | default('present') }}"
    autoconnect: "{{ item.autoconnect | default(true) }}"
    method4:     "{{ item.method4 | default('manual') }}"
    ip4:         "{{ item.ip4 | default(omit) }}"
    gw4:         "{{ item.gw4 | default(omit) }}"
    dns4:        "{{ item.dns4 | default(omit) }}"
    mtu:         "{{ item.mtu | default(omit) }}"
  loop: "{{ network_interfaces | selectattr('type', 'equalto', 'physical') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: network_interfaces configure - Configure bond interfaces
  community.general.nmcli:
    type:        bond
    conn_name:   "{{ item.name }}"
    ifname:      "{{ item.device | default(item.name) }}"
    mode:        "{{ item.bond_mode | default('802.3ad') }}"
    miimon:      "{{ item.bond_miimon | default(100) }}"
    state:       "{{ item.state | default('present') }}"
    autoconnect: "{{ item.autoconnect | default(true) }}"
    method4:     "{{ item.method4 | default('manual') }}"
    ip4:         "{{ item.ip4 | default(omit) }}"
    gw4:         "{{ item.gw4 | default(omit) }}"
    dns4:        "{{ item.dns4 | default(omit) }}"
    mtu:         "{{ item.mtu | default(omit) }}"
  loop: "{{ network_interfaces | selectattr('type', 'equalto', 'bond') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: network_interfaces configure - Enslave member NICs to their bond
  community.general.nmcli:
    type:        ethernet
    conn_name:   "{{ item.0.name }}-slave-{{ item.1 }}"
    ifname:      "{{ item.1 }}"
    master:      "{{ item.0.name }}"
    slave_type:  bond
    state:       "{{ item.0.state | default('present') }}"
    autoconnect: "{{ item.0.autoconnect | default(true) }}"
  loop: "{{ network_interfaces | selectattr('type', 'equalto', 'bond') | list | subelements('bond_members') }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}"

- name: network_interfaces configure - Configure VLAN subinterfaces
  community.general.nmcli:
    type:        vlan
    conn_name:   "{{ item.name }}"
    vlanid:      "{{ item.vlan_id }}"
    vlandev:     "{{ item.vlan_parent }}"
    state:       "{{ item.state | default('present') }}"
    autoconnect: "{{ item.autoconnect | default(true) }}"
    method4:     "{{ item.method4 | default('manual') }}"
    ip4:         "{{ item.ip4 | default(omit) }}"
    gw4:         "{{ item.gw4 | default(omit) }}"
    dns4:        "{{ item.dns4 | default(omit) }}"
    mtu:         "{{ item.mtu | default(omit) }}"
  loop: "{{ network_interfaces | selectattr('type', 'equalto', 'vlan') | list }}"
  loop_control:
    label: "{{ item.name }}"
