---

# Interface definitions. One list, three types (physical | bond | vlan) so
# a bond's members and a VLAN's parent can reference other entries in the
# same list by name. Empty by default — wrong physical device names
# (eth0 vs eno1 vs ens192 varies per host/NIC driver) can take out the
# interface carrying the current SSH session, so this is opt-in per host,
# never guessed.
#
# Common keys (all types):
#   name          Connection name (nmcli conn_name). Required.
#   type          physical | bond | vlan. Required.
#   state         present | absent. Default: present.
#   autoconnect   Start on boot. Default: true.
#   method4       manual | auto | disabled. Default: manual.
#   ip4           List of IPv4 CIDRs, e.g. ["10.0.0.5/24"].
#   gw4           IPv4 gateway.
#   dns4          List of IPv4 DNS servers.
#   mtu           Interface MTU.
#
# type: physical
#   device        Kernel interface name (e.g. eno1). Defaults to `name`.
#
# type: bond
#   device        Bond interface name (e.g. bond0). Defaults to `name`.
#   bond_mode     802.3ad | active-backup | balance-rr | ... Default: 802.3ad (LACP).
#   bond_miimon   MII link monitoring interval, ms. Default: 100.
#   bond_members  List of physical device names to enslave (e.g. [eno1, eno2]).
#                 Each becomes its own nmcli slave connection — do not also
#                 list them as separate `type: physical` entries.
#
# type: vlan
#   vlan_id       802.1q VLAN ID (0-4095). Required.
#   vlan_parent   Parent device name — a physical `device` or a bond `device`
#                 (not the parent's `name`, unless they're the same). Required.
#
network_interfaces: []

# Example — bonded LACP uplink with a couple of tagged VLANs on top, plus
# one untagged management NIC:
#
# network_interfaces:
#   - name: mgmt0
#     type: physical
#     device: eno1
#     ip4: ["10.0.0.5/24"]
#     gw4: 10.0.0.1
#     dns4: ["10.0.0.53"]
#
#   - name: bond0
#     type: bond
#     bond_mode: 802.3ad
#     bond_miimon: 100
#     bond_members: [eno2, eno3]
#
#   - name: vlan100
#     type: vlan
#     vlan_id: 100
#     vlan_parent: bond0
#     ip4: ["10.100.0.5/24"]
#     gw4: 10.100.0.1
#
#   - name: vlan200
#     type: vlan
#     vlan_id: 200
#     vlan_parent: bond0
#     ip4: ["10.200.0.5/24"]
