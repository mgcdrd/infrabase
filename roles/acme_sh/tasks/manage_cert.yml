---

# _cert is the loop variable from main.yml

- name: "acme_sh cert - Normalize domain list"
  become: false
  ansible.builtin.set_fact:
    _acme_domains: "{{ [_cert.domain] if _cert.domain is defined else _cert.domains }}"

- name: "acme_sh cert - Set primary domain facts"
  become: false
  ansible.builtin.set_fact:
    _acme_primary:  "{{ _acme_domains | first }}"
    _acme_state:    "{{ _cert.state | default('present') }}"
    _acme_cert_dir: "{{ acme_sh_cert_base_dir }}/{{ _acme_domains | first }}"

# Reset every iteration so credentials don't bleed from a dns_cf/dns_pdns
# cert into a subsequent cert that uses a different challenge.
- name: "acme_sh cert - Reset credential environment"
  become: false
  ansible.builtin.set_fact:
    _acme_env: {}

- name: "acme_sh cert - Set Cloudflare credentials for {{ _acme_primary }}"
  become: false
  ansible.builtin.set_fact:
    _acme_env: "{{ {'CF_Token': acme_sh_cf_token | trim} if acme_sh_cf_token | trim | length > 0 else {'CF_Key': acme_sh_cf_key | trim, 'CF_Email': acme_sh_cf_email | trim} }}"
  when:
    - _acme_state == 'present'
    - _cert.challenge == 'dns_cf'

- name: "acme_sh cert - Set PowerDNS credentials for {{ _acme_primary }}"
  become: false
  ansible.builtin.set_fact:
    _acme_env: >-
      {{
        {'PDNS_Url': acme_sh_pdns_url | trim,
         'PDNS_ServerId': acme_sh_pdns_server_id | trim,
         'PDNS_Token': acme_sh_pdns_token | trim}
        | combine({'PDNS_Ttl': acme_sh_pdns_ttl | trim} if acme_sh_pdns_ttl | trim | length > 0 else {})
      }}
  when:
    - _acme_state == 'present'
    - _cert.challenge == 'dns_pdns'

# acme.sh reads SAVED_CF_Token from account.conf before deciding which mode to
# use, so a stale token takes precedence over CF_Key/CF_Email in the environment.
# Clear it explicitly when we are in CF_Key mode.
- name: "acme_sh cert - Clear stale SAVED_CF_Token when using CF_Key mode"
  become: true
  ansible.builtin.lineinfile:
    path: /root/.acme.sh/account.conf
    regexp: '^SAVED_CF_Token='
    state: absent
  when:
    - _acme_state == 'present'
    - _cert.challenge == 'dns_cf'
    - acme_sh_cf_token | trim | length == 0

# ---- ABSENT: revoke and remove ----

- name: "acme_sh cert - Revoke and remove {{ _acme_primary }}"
  become: true
  ansible.builtin.command:
    argv:
      - /root/.acme.sh/acme.sh
      - --revoke
      - -d
      - "{{ _acme_primary }}"
      - --remove
  when: _acme_state == 'absent'
  failed_when: false
  changed_when: true

- name: "acme_sh cert - Remove deployed cert dir for {{ _acme_primary }}"
  become: true
  ansible.builtin.file:
    path: "{{ _acme_cert_dir }}"
    state: absent
  when: _acme_state == 'absent'

# ---- PRESENT: issue or renew ----

- name: "acme_sh cert - Ensure deploy dir exists for {{ _acme_primary }}"
  become: true
  ansible.builtin.file:
    path: "{{ _acme_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: _acme_state == 'present'

- name: "acme_sh cert - Issue or renew {{ _acme_primary }}"
  become: true
  ansible.builtin.shell:
    cmd: >-
      /root/.acme.sh/acme.sh --issue
      {{ _acme_domains | map('regex_replace', '^(.*)$', '-d \1') | join(' ') }}
      {% if _cert.challenge == 'dns_cf' %}--dns dns_cf
      {% elif _cert.challenge == 'dns_pdns' %}--dns dns_pdns
      {% elif _cert.challenge == 'standalone' %}--standalone
      {% elif _cert.challenge == 'webroot' %}--webroot {{ _cert.webroot_path | default('') }}
      {% elif _cert.challenge == 'nginx' %}--nginx
      {% elif _cert.challenge == 'apache' %}--apache
      {% endif %}
      {% if _cert.keylength | default(acme_sh_keylength) | length > 0 %}--keylength {{ _cert.keylength | default(acme_sh_keylength) }}{% endif %}
      {% if acme_sh_staging | bool %}--staging{% endif %}
    chdir: /root/.acme.sh
  environment: "{{ _acme_env }}"
  register: _acme_issue
  # exit 2 = cert already valid and not due for renewal; capture all
  # failures here so we can show the log before failing the task.
  # no_log not needed — credentials are in environment:, not the cmd.
  failed_when: false
  changed_when: _acme_issue.rc == 0
  when: _acme_state == 'present'

# acme.sh writes a full log to ~/.acme.sh/acme.sh.log — read it on failure
# so we can diagnose without exposing credentials in task output.
- name: "acme_sh cert - Show acme.sh log on issue failure"
  become: true
  ansible.builtin.command:
    argv: [tail, "-80", /root/.acme.sh/acme.sh.log]
  register: _acme_log
  changed_when: false
  failed_when: false
  when:
    - _acme_state == 'present'
    - _acme_issue.rc not in [0, 2]

- name: "acme_sh cert - Print acme.sh log"
  ansible.builtin.debug:
    var: _acme_log.stdout_lines
  when:
    - _acme_state == 'present'
    - _acme_issue.rc not in [0, 2]

- name: "acme_sh cert - Fail on issue error"
  ansible.builtin.fail:
    msg: "acme.sh --issue failed for {{ _acme_primary }} (rc={{ _acme_issue.rc }}) — see log above"
  when:
    - _acme_state == 'present'
    - _acme_issue.rc not in [0, 2]

# A cert can exist without an --install-cert registration (issued manually,
# or issue returned rc=2 on a fresh host) — in that state renewals would
# never propagate to the deploy dir or run the reloadcmd. Detect it so the
# deploy task below can register.
- name: "acme_sh cert - Check install registration for {{ _acme_primary }}"
  become: true
  ansible.builtin.shell:
    cmd: >-
      grep -q '^Le_RealCertPath=.\{3,\}'
      "/root/.acme.sh/{{ _acme_primary }}{{ '_ecc' if (_cert.keylength | default(acme_sh_keylength)).startswith('ec-') else '' }}/{{ _acme_primary }}.conf"
  register: _acme_registered
  changed_when: false
  failed_when: false
  when: _acme_state == 'present'

# With complete_chain, ca.pem receives the full chain (fullchain + ISRG
# Root X1 appended below) and no separate fullchain.pem is deployed —
# consumers like katello-certs validate ca.pem to a self-contained root.
- name: "acme_sh cert - Deploy cert files for {{ _acme_primary }}"
  become: true
  ansible.builtin.shell:
    cmd: >-
      /root/.acme.sh/acme.sh --install-cert -d {{ _acme_primary }}
      {% if (_cert.keylength | default(acme_sh_keylength)).startswith('ec-') %}--ecc{% endif %}
      --cert-file      {{ _acme_cert_dir }}/cert.pem
      --key-file       {{ _acme_cert_dir }}/key.pem
      {% if _cert.complete_chain | default(false) | bool %}
      --fullchain-file {{ _acme_cert_dir }}/ca.pem
      {% else %}
      --fullchain-file {{ _acme_cert_dir }}/fullchain.pem
      --ca-file        {{ _acme_cert_dir }}/ca.pem
      {% endif %}
      {% if _cert.reload_cmd | default('') | length > 0 %}
      --reloadcmd '{{ _cert.reload_cmd }}'
      {% endif %}
    chdir: /root/.acme.sh
  when:
    - _acme_state == 'present'
    - _acme_issue.rc == 0 or _acme_registered.rc != 0
  changed_when: true

- name: "acme_sh cert - Root the deployed chain for {{ _acme_primary }}"
  become: true
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/complete-le-chain.sh
      - -f
      - "{{ _acme_cert_dir }}/ca.pem"
      - -l
      - "{{ _acme_cert_dir }}/cert.pem"
      - -c
      - "{{ _cert.root_cn | default(acme_sh_root_cn) }}"
      - -p
      - "{{ _cert.root_fingerprint | default(acme_sh_root_fingerprint) }}"
      - -r
      - "{{ (_cert.root_urls | default(acme_sh_root_urls)) | join(',') }}"
  when:
    - _acme_state == 'present'
    - _acme_issue.rc == 0 or _acme_registered.rc != 0
    - _cert.complete_chain | default(false) | bool
  changed_when: true
