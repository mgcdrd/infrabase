---

- name: acme_sh install - Install dependencies
  become: true
  ansible.builtin.package:
    name: "{{ ['wget', 'cronie'] if ansible_os_family == 'RedHat' else ['wget', 'cron'] }}"
    state: present

# Official install method: pipes directly to sh, no intermediate files.
# The email flag registers it with the installer so acme.sh --list-accounts works.
# creates: makes this idempotent — skipped if already installed.
- name: acme_sh install - Install acme.sh
  become: true
  ansible.builtin.shell:
    cmd: "wget -O- https://get.acme.sh | sh -s email={{ acme_sh_email }}"
  args:
    creates: /root/.acme.sh/acme.sh

- name: acme_sh install - Ensure cert base directory exists
  become: true
  ansible.builtin.file:
    path: "{{ acme_sh_cert_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
