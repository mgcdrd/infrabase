---

- name: acme_sh install - Install dependencies
  become: true
  ansible.builtin.package:
    name: "{{ ['git', 'cronie'] if ansible_os_family == 'RedHat' else ['git', 'cron'] }}"
    state: present

- name: acme_sh install - Check if acme.sh is already installed
  become: true
  ansible.builtin.stat:
    path: /root/.acme.sh/acme.sh
  register: _acme_sh_binary

# Clone the full repo so the dnsapi/ plugin directory is present when
# the installer runs. A shallow clone keeps the download small.
- name: acme_sh install - Clone acme.sh source
  become: true
  ansible.builtin.git:
    repo: https://github.com/acmesh-official/acme.sh.git
    dest: /root/.acme_src
    version: master
    depth: 1
  when: not _acme_sh_binary.stat.exists

- name: acme_sh install - Run acme.sh installer
  become: true
  ansible.builtin.command:
    argv:
      - ./acme.sh
      - --install
      - --no-profile
      - --log
      - --accountemail
      - "{{ acme_sh_email }}"
    chdir: /root/.acme_src
  when: not _acme_sh_binary.stat.exists
  changed_when: true

- name: acme_sh install - Remove source clone
  become: true
  ansible.builtin.file:
    path: /root/.acme_src
    state: absent
  when: not _acme_sh_binary.stat.exists

# A flat_ssl_dir consumer's symlinks resolve through this directory to
# reach the real files — root:root mode 0750 blocks a non-root reader
# from even traversing it, regardless of the files' own ownership
# (acme_sh_flat_ssl_owner/_group, fixed up per-domain in manage_cert.yml).
# Stays root:root (unchanged) when acme_sh_flat_ssl_dir isn't in use.
- name: acme_sh install - Ensure cert base directory exists
  become: true
  ansible.builtin.file:
    path: "{{ acme_sh_cert_base_dir }}"
    state: directory
    owner: "{{ acme_sh_flat_ssl_owner if acme_sh_flat_ssl_dir | length > 0 else 'root' }}"
    group: "{{ acme_sh_flat_ssl_group if acme_sh_flat_ssl_dir | length > 0 else 'root' }}"
    mode: "0750"

# Roots a Let's Encrypt fullchain with ISRG Root X1 (fingerprint-pinned)
# and validates it. Used by certs with complete_chain: true and available
# to renewal hooks.
- name: acme_sh install - Deploy complete-le-chain.sh
  become: true
  ansible.builtin.copy:
    src: complete-le-chain.sh
    dest: /usr/local/sbin/complete-le-chain.sh
    owner: root
    group: root
    mode: "0700"

# Deployed on the issuer only — reload_cmd on non-issuer hosts never runs
# since manage_cert.yml never executes there. AppRole role_id/secret_id
# files it reads at runtime are pre-positioned by the identity build, not
# by this role (see acme_sh_vault_role_id_file/acme_sh_vault_secret_id_file).
- name: acme_sh install - Deploy acme-sh-vault-push.sh
  become: true
  ansible.builtin.template:
    src: acme-sh-vault-push.sh.j2
    dest: /usr/local/sbin/acme-sh-vault-push.sh
    owner: root
    group: root
    mode: "0700"
  when: acme_sh_vault_kv_enabled
