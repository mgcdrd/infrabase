---

- name: acme_sh install - Install dependencies
  become: true
  ansible.builtin.package:
    name: "{{ ['wget', 'cronie'] if ansible_os_family == 'RedHat' else ['wget', 'cron'] }}"
    state: present

- name: acme_sh install - Check if acme.sh is already installed
  become: true
  ansible.builtin.stat:
    path: /root/.acme.sh/acme.sh
  register: _acme_sh_binary

# The installer does `cp acme.sh ~/.acme.sh/acme.sh` relative to CWD,
# so the script must be named acme.sh and run from its own directory.
- name: acme_sh install - Download acme.sh script
  become: true
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/acmesh-official/acme.sh/master/acme.sh
    dest: /root/acme.sh
    mode: "0700"
    force: true
  when: not _acme_sh_binary.stat.exists

- name: acme_sh install - Run acme.sh installer
  become: true
  ansible.builtin.command:
    argv:
      - ./acme.sh
      - --install
      - --no-profile
      - --log
      - --accountemail
      - "{{ acme_sh_email }}"
    chdir: /root
  when: not _acme_sh_binary.stat.exists
  changed_when: true

- name: acme_sh install - Remove installer script
  become: true
  ansible.builtin.file:
    path: /root/acme.sh
    state: absent
  when: not _acme_sh_binary.stat.exists

- name: acme_sh install - Ensure cert base directory exists
  become: true
  ansible.builtin.file:
    path: "{{ acme_sh_cert_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
