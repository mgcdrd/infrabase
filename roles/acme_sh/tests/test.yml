---

- hosts: all
  gather_facts: true
  become: true
  roles:
    - mgcdrd.infrabase.acme_sh
  vars:
    acme_sh_register_email: "admin@lab.example.com"
    acme_sh_ca: letsencrypt
    acme_sh_staging: true                    # use staging for tests

    acme_sh_cf_token: "{{ lookup('community.hashi_vault.vault_kv2_get', vault_kv_env + '/cloudflare', engine_mount_point=vault_kv_infra_mount, url=vault_addr).secret.token }}"

    acme_sh_certs:
      - domains:
          - "dns.lab.example.com"
        challenge: dns_cf
        reload_cmd: "docker compose -f /srv/phpipam/docker-compose.yaml restart phpipam-web"
        state: present
