---

# =====================
# Cluster node entries (only when etc_hosts_group is set)
- name: etc_hosts - Validate etc_hosts_group exists in inventory
  ansible.builtin.assert:
    that:
      - etc_hosts_group in groups
    fail_msg: >-
      etc_hosts_group '{{ etc_hosts_group }}' does not exist in the inventory.
  when: etc_hosts_group | length > 0

- name: etc_hosts - Resolve target host list
  ansible.builtin.set_fact:
    _etc_hosts_hosts: "{{ groups[etc_hosts_group] }}"
    _etc_hosts_label: "{{ etc_hosts_group | upper }}"
  when: etc_hosts_group | length > 0

- name: etc_hosts - Write cluster node entries to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED {{ _etc_hosts_label }} NODES"
    block: "{{ lookup('template', 'etc_hosts_cluster.j2') }}"
    backup: true
  when: etc_hosts_group | length > 0

# =====================
# Static entries (only when etc_hosts_entries is non-empty)
- name: etc_hosts - Write static entries to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED STATIC ENTRIES"
    block: "{{ lookup('template', 'etc_hosts_static.j2') }}"
    backup: true
  when: etc_hosts_entries | length > 0
