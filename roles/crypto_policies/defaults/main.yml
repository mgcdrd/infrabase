---

crypto_policies_cis: true

# Additional policy modules to deploy. Each entry requires:
#   src - template in this role's (or the caller's) templates/ dir
#   dst - module file name only, e.g. no-temp.pmod; the role always writes it
#         to /etc/crypto-policies/policies/modules/ (any directory part is dropped)
# Example:
#   crypto_policies_additional:
#     - { src: no-temp.pmod.j2, dst: no-temp.pmod }
crypto_policies_additional: []
