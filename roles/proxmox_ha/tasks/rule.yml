---
- name: rule - fail if required variables are unset
  ansible.builtin.fail:
    msg: "proxmox_ha_rules must be a non-empty list, and each item needs a 'name' key."
  when: proxmox_ha_rules | length == 0

- name: rule - create/update/delete HA node/resource-affinity rules
  community.proxmox.proxmox_cluster_ha_rules:
    api_host:         "{{ proxmox_api_host }}"
    api_user:         "{{ proxmox_api_user }}"
    api_password:     "{{ proxmox_api_password | default(omit) }}"
    api_token_id:     "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs:   "{{ proxmox_validate_certs }}"
    state:      "{{ item.state | default('present') }}"
    name:       "{{ item.name }}"
    type:       "{{ item.type | default(omit) }}"
    affinity:   "{{ item.affinity | default(omit) }}"
    nodes:      "{{ item.nodes | default(omit) }}"
    resources:  "{{ item.resources | default(omit) }}"
    strict:     "{{ item.strict | default(omit) }}"
    disable:    "{{ item.disable | default(omit) }}"
    comment:    "{{ item.comment | default(omit) }}"
    force:      "{{ item.force | default(omit) }}"
  loop: "{{ proxmox_ha_rules }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
