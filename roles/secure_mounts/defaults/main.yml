---

# List of mounts to configure with security-hardened options.
# Each entry requires 'path' and 'opts'. 'src' and 'fstype' are passed through
# when the mount does not already exist in /etc/fstab.
secure_mounts_list:
  - path:   /dev/shm
    src:    none
    fstype: tmpfs
    opts:   nodev,noexec,nosuid
