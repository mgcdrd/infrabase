---
# ---- ProxMox API connection ----
# Uses the shared proxmox_api_* vars — see collections/infrabase/README.md.

# ---- VM targeting ----
# The role looks up the VM by name to discover its VMID automatically.
# Defaults from the shared proxmox_target_vm_name var (falls back to
# inventory_hostname) — set that once if a play targets the same VM across
# several proxmox_* roles, or override proxmox_nic_vm_name here if just this
# role's target differs.
proxmox_nic_vm_name: "{{ proxmox_target_vm_name | default(inventory_hostname) }}"

# Set this directly to skip discovery entirely (e.g. when this role runs
# right after proxmox_vm's clone task and the VMID is already known).
proxmox_nic_vmid: ""

# ---- NIC configuration ----
# One entry per interface slot to manage (net0-net31). net0 is normally owned
# by proxmox_vm at clone time (proxmox_vm_net0) — only list it here for
# post-creation changes. Deleting a NIC just needs interface + state: absent.
#
# proxmox_nic_interfaces:
#   - interface: net1
#     bridge: vmbr1
#     model: virtio       # e1000 | rtl8139 | virtio (default) | ...
#     tag: 100             # VLAN tag
#     firewall: false
#     mtu: ""              # virtio only; "" leaves it unset
#     mac: ""              # "" lets PVE generate one / keeps the existing one
#     state: present        # present | absent
#   - interface: net2
#     state: absent
proxmox_nic_interfaces: []
