---

# =====================
# Ensure lvm2 is installed
- name: lvm2 main - Install lvm2
  import_tasks: install.yml

# =====================
# Refresh LVM facts unconditionally — bypasses fact cache so the preflight
# sees current VG free space (e.g. after a swap LV was removed earlier in the play).
- name: lvm2 main - Refresh hardware facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - hardware

# =====================
# Detect the OS volume group from the root mount unless overridden
- name: lvm2 main - Detect OS volume group
  import_tasks: detect_os_vg.yml

# =====================
# Safety checks — run before touching anything
- name: lvm2 main - Preflight validation
  import_tasks: preflight.yml
  when: lvm_volumes | length > 0 or lvm_vg_extensions | length > 0

# =====================
# Extend VGs first (adds space before LV extension may need it)
- name: lvm2 main - Extend volume groups
  import_tasks: extend_vg.yml
  when: lvm_vg_extensions | length > 0

# Refresh LVM facts after VG changes so subsequent space checks reflect new PVs
- name: lvm2 main - Refresh LVM facts after VG extension
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - hardware
  when: lvm_vg_extensions | length > 0

# =====================
# Extend LVs
- name: lvm2 main - Extend logical volumes
  import_tasks: extend_lv.yml
  when: lvm_volumes | length > 0
