---

# Disable and mask the NFS server service. Safe to enable on hosts where NFS
# server is not intentionally running.
hardened_services_disable_nfs: true

# Require sulogin authentication for emergency and rescue systemd targets via
# drop-in overrides in /etc/systemd/system/{emergency,rescue}.service.d/.
hardened_services_emergency_auth: true

# Ensure chronyd runs as an unprivileged user (chrony on RedHat, _chrony on Debian).
# Set to false on hosts where chrony is not installed.
hardened_services_chronyd_user: true

# Disable and mask unused services. Each only acts if the service is present on the host.
hardened_services_disable_bluetooth: true
hardened_services_disable_autofs:    true
hardened_services_disable_rpcbind:   true

# chmod 0600 /boot/grub2/user.cfg (GRUB password file). RedHat only — no-op
# if the file doesn't exist (e.g. no GRUB password configured).
hardened_services_fix_grub_user_cfg: true

# Scan real (non-pseudo) local filesystems for files with no owning user or
# group and chown them to root:root. CIS: file_permissions_ungroupowned,
# no_files_unowned_by_user. Off by default — a full filesystem walk is
# expensive and this can mask genuine orphaned-file problems if left silent;
# enable per-host once you've reviewed what it would touch.
hardened_services_fix_unowned_files: false

# Local filesystem types to include in the unowned-file scan above. Excludes
# network/pseudo filesystems (nfs, tmpfs, proc, sysfs, overlay, ...) so the
# scan never touches NFS-mounted or container-managed content.
hardened_services_local_fstypes:
  - xfs
  - ext4
  - ext3
  - btrfs
