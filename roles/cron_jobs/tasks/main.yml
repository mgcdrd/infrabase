---

- name: cron_jobs - Validate job definitions
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.job is defined or item.state | default('present') == 'absent'
    fail_msg: >-
      cron_jobs entry '{{ item.name | default("(missing name)") }}' needs a
      'job' unless state is 'absent'.
    quiet: true
  loop: "{{ cron_jobs }}"
  loop_control:
    label: "{{ item.name | default('?') }}"

- name: cron_jobs - Manage per-user cron jobs
  ansible.builtin.cron:
    name: "{{ item.name }}"
    user: "{{ item.user | default('root') }}"
    job: "{{ item.job | default(omit) }}"
    minute: "{{ item.minute | default(omit) }}"
    hour: "{{ item.hour | default(omit) }}"
    day: "{{ item.day | default(omit) }}"
    month: "{{ item.month | default(omit) }}"
    weekday: "{{ item.weekday | default(omit) }}"
    special_time: "{{ item.special_time | default(omit) }}"
    state: "{{ item.state | default('present') }}"
    disabled: "{{ item.disabled | default(omit) }}"
  loop: "{{ cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
