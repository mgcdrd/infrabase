---

- name: sudoers main - Find timestamp_timeout entries in /etc/sudoers.d/*
  ansible.builtin.find:
    path: /etc/sudoers.d
    patterns: '*'
    contains: '^\s*Defaults\s.*\btimestamp_timeout\s*=.*'
  register: _sudoers_d_timestamp

- name: sudoers main - Remove duplicate timestamp_timeout from /etc/sudoers.d/*
  ansible.builtin.lineinfile:
    path:   "{{ item.path }}"
    regexp: '^\s*Defaults\s.*\btimestamp_timeout\s*=.*'
    state:  absent
  loop: "{{ _sudoers_d_timestamp.files }}"

- name: sudoers main - Set timestamp_timeout in /etc/sudoers
  ansible.builtin.lineinfile:
    path:     /etc/sudoers
    regexp:   '^\s*Defaults\s(.*)\btimestamp_timeout\s*=\s*[-]?\w+\b(.*)$'
    line:     'Defaults \1timestamp_timeout={{ sudoers_timestamp_timeout }}\2'
    validate: /usr/sbin/visudo -cf %s
    backrefs: true
  register: _sudoers_timeout_edit

- name: sudoers main - Insert timestamp_timeout if not already present
  ansible.builtin.lineinfile:
    path:     /etc/sudoers
    line:     'Defaults timestamp_timeout={{ sudoers_timestamp_timeout }}'
    validate: /usr/sbin/visudo -cf %s
  when: not _sudoers_timeout_edit.changed

- name: sudoers main - Configure sudo log file
  ansible.builtin.lineinfile:
    path:     /etc/sudoers
    regexp:   '^\s*Defaults\s.*\blogfile\s*=.*'
    line:     'Defaults logfile={{ sudoers_log_file }}'
    validate: /usr/sbin/visudo -cf %s
