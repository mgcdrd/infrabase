---

- name: cron main - Remove /etc/cron.deny
  ansible.builtin.file:
    path:  /etc/cron.deny
    state: absent

- name: cron main - Create /etc/cron.allow
  ansible.builtin.file:
    path:              /etc/cron.allow
    state:             touch
    owner:             root
    group:             root
    mode:              "0600"
    modification_time: preserve
    access_time:       preserve
