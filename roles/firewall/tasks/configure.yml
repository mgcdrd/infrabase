---

# --- RedHat: firewalld ---

- name: firewall configure - Set default zone (RedHat)
  ansible.builtin.command:
    cmd: "firewall-cmd --set-default-zone={{ firewall_default_zone }}"
  register: _firewall_zone
  changed_when: "'ALREADY_SET' not in _firewall_zone.stdout"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Assign interfaces to zones (RedHat)
  ansible.posix.firewalld:
    zone:      "{{ item.0.name }}"
    interface: "{{ item.1 }}"
    state:     enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_zones | subelements('interfaces', skip_missing=True) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Bind sources to zones (RedHat)
  # firewalld --add-source: traffic from these CIDRs gets the zone's full
  # ruleset, same as arriving on one of its interfaces (OR'd with interfaces).
  ansible.posix.firewalld:
    zone:      "{{ item.0.name }}"
    source:    "{{ item.1 }}"
    state:     enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_zones | subelements('sources', skip_missing=True) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Allow TCP ports per zone (RedHat)
  ansible.posix.firewalld:
    zone:      "{{ item.0.name }}"
    port:      "{{ item.1 }}/tcp"
    state:     enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_zones | subelements('allowed_tcp_ports', skip_missing=True) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Allow UDP ports per zone (RedHat)
  ansible.posix.firewalld:
    zone:      "{{ item.0.name }}"
    port:      "{{ item.1 }}/udp"
    state:     enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_zones | subelements('allowed_udp_ports', skip_missing=True) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Allow named services per zone (RedHat)
  ansible.posix.firewalld:
    zone:      "{{ item.0.name }}"
    service:   "{{ item.1 }}"
    state:     enabled
    permanent: true
    immediate: true
  loop: "{{ firewall_zones | subelements('allowed_services', skip_missing=True) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Enable masquerade per zone (RedHat)
  ansible.posix.firewalld:
    zone:       "{{ item.name }}"
    masquerade: true
    state:      enabled
    permanent:  true
    immediate:  true
  loop: "{{ firewall_zones | selectattr('masquerade', 'defined') | selectattr('masquerade') | list }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Add port forwards per zone (RedHat)
  ansible.posix.firewalld:
    zone: "{{ item.0.name }}"
    port_forward:
      - port:    "{{ item.1.port }}"
        proto:   "{{ item.1.proto }}"
        toport:  "{{ item.1.to_port }}"
        toaddr:  "{{ item.1.to_addr | default(omit) }}"
    state:      enabled
    permanent:  true
    immediate:  true
  loop: "{{ firewall_zones | subelements('forward_ports', skip_missing=True) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Build source-scoped rich rules (RedHat)
  # zone.source_rules ANDs a source with a specific port/service. This is a
  # zone -> source_rules -> sources x {tcp,udp,services} fan-out that
  # subelements can't express, so render it to YAML and parse it back into a
  # flat {zone, rule} list. Family is picked per address (':' => ipv6) because
  # a rich rule's family must match its source.
  ansible.builtin.set_fact:
    _firewall_source_rich_rules: "{{ _firewall_source_rich_rules_yaml | from_yaml | default([], true) }}"
  vars:
    _firewall_source_rich_rules_yaml: |
      {% for z in firewall_zones %}
      {% for r in z.source_rules | default([]) %}
      {% for s in r.sources | default([]) %}
      {% for p in r.tcp_ports | default([]) %}
      - zone: "{{ z.name }}"
        rule: 'rule family="{{ "ipv6" if ":" in s else "ipv4" }}" source address="{{ s }}" port port="{{ p }}" protocol="tcp" accept'
      {% endfor %}
      {% for p in r.udp_ports | default([]) %}
      - zone: "{{ z.name }}"
        rule: 'rule family="{{ "ipv6" if ":" in s else "ipv4" }}" source address="{{ s }}" port port="{{ p }}" protocol="udp" accept'
      {% endfor %}
      {% for svc in r.services | default([]) %}
      - zone: "{{ z.name }}"
        rule: 'rule family="{{ "ipv6" if ":" in s else "ipv4" }}" source address="{{ s }}" service name="{{ svc }}" accept'
      {% endfor %}
      {% endfor %}
      {% endfor %}
      {% endfor %}
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Apply source-scoped rich rules (RedHat)
  ansible.posix.firewalld:
    zone:      "{{ item.zone }}"
    rich_rule: "{{ item.rule }}"
    state:     enabled
    permanent: true
    immediate: true
  loop: "{{ _firewall_source_rich_rules | default([]) }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Assign loopback interface to trusted zone (RedHat)
  ansible.posix.firewalld:
    zone:      trusted
    interface: lo
    state:     enabled
    permanent: true
    immediate: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Remove superseded loopback rich rules (RedHat)
  # An earlier version of this role placed these in firewall_default_zone
  # using the 127.0.0.0/8 network. CIS's own remediation puts them in the
  # trusted zone against the single address 127.0.0.1 — clean up the old
  # ones so they don't linger (firewalld is additive; wrong rules don't
  # self-remove when the task below changes).
  ansible.posix.firewalld:
    zone:       "{{ firewall_default_zone }}"
    rich_rule:  "{{ item }}"
    state:      disabled
    permanent:  true
    immediate:  true
  loop:
    - 'rule family="ipv4" source address="127.0.0.0/8" destination not address="127.0.0.0/8" drop'
    - 'rule family="ipv6" source address="::1" destination not address="::1" drop'
  when: ansible_facts['os_family'] == 'RedHat'

- name: firewall configure - Drop spoofed loopback-sourced traffic (RedHat)
  # CIS: reject packets claiming a 127.0.0.1 or ::1 source on the trusted
  # zone — genuine loopback traffic arrives via lo (already trusted above),
  # so anything hitting this rule is spoofed.
  ansible.posix.firewalld:
    zone:       trusted
    rich_rule:  "{{ item }}"
    state:      enabled
    permanent:  true
    immediate:  true
  loop:
    - 'rule family="ipv4" source address="127.0.0.1" destination not address="127.0.0.1" drop'
    - 'rule family="ipv6" source address="::1" destination not address="::1" drop'
  when: ansible_facts['os_family'] == 'RedHat'

# --- Debian: nftables ---

- name: firewall configure - Warn that source firewalling is RedHat-only (Debian)
  ansible.builtin.debug:
    msg: >-
      firewall: 'sources' / 'source_rules' set on zone(s)
      {{ _firewall_src_zones | join(', ') }} are not implemented on the nftables
      (Debian) path yet and are ignored. Port/interface rules still apply.
  vars:
    _firewall_src_zones: >-
      {{ ((firewall_zones | selectattr('sources', 'defined') | selectattr('sources') | map(attribute='name') | list)
          + (firewall_zones | selectattr('source_rules', 'defined') | selectattr('source_rules') | map(attribute='name') | list))
         | unique }}
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _firewall_src_zones | length > 0

- name: firewall configure - Deploy nftables ruleset (Debian)
  ansible.builtin.template:
    src:   nftables.conf.j2
    dest:  /etc/nftables.conf
    owner: root
    group: root
    mode:  "0640"
  notify: reload nftables
  when: ansible_facts['os_family'] == 'Debian'

- name: firewall configure - Ensure nftables is running (Debian)
  ansible.builtin.systemd_service:
    name:  nftables
    state: started
  when: ansible_facts['os_family'] == 'Debian'
