---

- name: qemu_guest_agent main - Detect container guest
  ansible.builtin.set_fact:
    _qemu_guest_agent_in_container: "{{ (ansible_facts['virtualization_role'] | default('host')) == 'guest'
      and ansible_facts['virtualization_type'] | default('') in qemu_guest_agent_container_virt_types }}"

- name: qemu_guest_agent main - Install and enable qemu-guest-agent
  # qemu-guest-agent talks to the host over a virtio-serial channel that
  # only a full QEMU/KVM guest exposes. In an LXC/nspawn/Docker container
  # the service has no transport and fails to start, so skip the role
  # entirely there unless qemu_guest_agent_skip_in_container is set false.
  when: not (qemu_guest_agent_skip_in_container and _qemu_guest_agent_in_container)
  block:
    - name: qemu_guest_agent main - Install qemu-guest-agent (Debian)
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: qemu_guest_agent main - Install qemu-guest-agent (RedHat)
      ansible.builtin.dnf:
        name: qemu-guest-agent
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: qemu_guest_agent main - Enable and start qemu-guest-agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent.service
        state: started
        enabled: true
